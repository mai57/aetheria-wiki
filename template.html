<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aetheria Wiki</title>
<style>
:root{
  --bg:#f6f3ec; --panel:#fffdf8; --panel-2:#f1ece1; --line:#e2dacb; --text:#2b261e; --muted:#7a7062;
  --accent:#9a6b14; --accent-soft:#f4e6c6; --sel:#efe0bd; --link:#8a5a00;
  --good:#1f7a4d; --good-bg:#dcf2e5; --bad:#b3261e; --bad-bg:#fbe1de; --warn:#9a5b00; --warn-bg:#fcecd2;
  --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16140f; --panel:#1f1c16; --panel-2:#29251d; --line:#3a3428; --text:#ece6da; --muted:#a59c8c;
    --accent:#e0b154; --accent-soft:#3b3020; --sel:#3d3322; --link:#f0c46a;
    --good:#6fd3a0; --good-bg:#18382a; --bad:#ff8f86; --bad-bg:#43201d; --warn:#f3b65a; --warn-bg:#3e2c14;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#16140f; --panel:#1f1c16; --panel-2:#29251d; --line:#3a3428; --text:#ece6da; --muted:#a59c8c;
  --accent:#e0b154; --accent-soft:#3b3020; --sel:#3d3322; --link:#f0c46a;
  --good:#6fd3a0; --good-bg:#18382a; --bad:#ff8f86; --bad-bg:#43201d; --warn:#f3b65a; --warn-bg:#3e2c14;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Sarabun","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
header{display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;min-height:52px}
header .brand{font-weight:700;color:var(--accent);white-space:nowrap}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
nav a{padding:14px 12px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;font-weight:500}
nav a:hover{color:var(--text);text-decoration:none}
nav a.on{color:var(--text);border-bottom-color:var(--accent)}
nav a .n{font-size:12px;color:var(--muted);margin-left:4px}
header .meta{font-size:12px;color:var(--muted);white-space:nowrap}
header button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 8px;cursor:pointer;font:inherit;font-size:12px}
main{flex:1;display:grid;grid-template-columns:minmax(300px,380px) 1fr;min-height:0}
#side{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);min-height:0}
#filters{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
#filters input[type=search]{flex:1 1 100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
#filters select{flex:1 1 30%;min-width:0;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit;font-size:13px}
#filters label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer}
#count{font-size:12px;color:var(--muted);padding:4px 12px;border-bottom:1px solid var(--line)}
#list{flex:1;overflow-y:auto;outline:none}
.row{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--text)}
.row:hover{background:var(--panel-2);text-decoration:none}
.row.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.row .ic{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center}
.row .ic img{max-width:32px;max-height:32px;object-fit:contain}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
#detail{overflow-y:auto;padding:24px 28px 60px;min-width:0}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.dh{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
.dh .big{width:72px;height:72px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.dh .big img{max-width:64px;max-height:64px;object-fit:contain}
.dh .big.mon{width:120px;height:120px}
.dh .big.mon img{max-width:112px;max-height:112px}
.dh h1{margin:0 0 4px;font-size:22px;line-height:1.25}
.dh .sub{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-size:12px;white-space:nowrap}
.tag.star{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tag.far{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.tag.farsk{border-style:dashed;color:var(--warn)}
.el{display:inline-block;padding:0 7px;border-radius:999px;font-size:12px;color:#fff;white-space:nowrap}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
section h2{margin:0 0 10px;font-size:15px;color:var(--accent)}
section p{margin:4px 0}
.note{color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 16px}
.kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:2px 0}
.kv span{color:var(--muted)}
ul.plain{margin:0;padding-left:18px}
ul.plain li{margin:2px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
.mini{display:inline-flex;align-items:center;gap:6px}
.mini img{width:24px;height:24px;object-fit:contain}
td .mini{white-space:nowrap}
.cc-ctl{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:10px 0}
.cc-ctl label{display:inline-flex;align-items:center;gap:6px}
.cc-ctl select,.cc-ctl input[type=number]{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
#pk .cc-ctl label{cursor:pointer}
.pk-img{width:24px;height:24px;object-fit:contain}
.cc-els{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cc-els label{display:inline-flex;align-items:center;gap:3px;cursor:pointer;opacity:.45}
.cc-els label.on{opacity:1}
.cc-els input{display:none}
.chipbtn{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);border-radius:999px;padding:0 8px;font:inherit;font-size:12px;cursor:pointer;margin:2px 4px 2px 0}
.chipbtn:hover{border-color:var(--bad);color:var(--bad)}
.cc-cards{display:flex;flex-direction:column;gap:2px}
.cc-cards span{white-space:nowrap}
.cc-cards .mini img{width:20px;height:20px}
.cc-cards .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 4px}
.cc-cards .x:hover{color:var(--bad)}
.mul{display:inline-block;min-width:44px;text-align:center;border-radius:6px;padding:0 6px;font-variant-numeric:tabular-nums;font-weight:600}
.mul.g{background:var(--good-bg);color:var(--good)}
.mul.b{background:var(--bad-bg);color:var(--bad)}
.mul.w{background:var(--warn-bg);color:var(--warn)}
.mul.n{background:var(--panel-2);color:var(--muted);font-weight:500}
tr.best td{background:var(--accent-soft)}
.r-common{} .r-uncommon{color:#3a8d3a} .r-rare{color:#2f6fbf} .r-epic{color:#8a46c9} .r-legendary{color:#c77a12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .r-uncommon{color:#7fd17f}:root:not([data-theme="light"]) .r-rare{color:#7fb2f2}:root:not([data-theme="light"]) .r-epic{color:#c79bf2}:root:not([data-theme="light"]) .r-legendary{color:#f2b65a}}
:root[data-theme="dark"] .r-uncommon{color:#7fd17f}:root[data-theme="dark"] .r-rare{color:#7fb2f2}:root[data-theme="dark"] .r-epic{color:#c79bf2}:root[data-theme="dark"] .r-legendary{color:#f2b65a}
/* peek panel: details of a linked monster/card/item/skill, without leaving the page */
#peek{position:fixed;top:52px;right:0;bottom:0;width:min(500px,100vw);background:var(--bg);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.18);z-index:30;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .18s ease;visibility:hidden}
#peek.open{transform:none;visibility:visible}
#peek .pk-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
#peek .pk-bar button,#peek .pk-bar a{border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:6px;padding:3px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
#peek .pk-bar a:hover{text-decoration:none;border-color:var(--accent)}
#peek .pk-bar button:disabled{opacity:.35;cursor:default}
#peek .pk-bar .pk-t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pk-body{overflow-y:auto;padding:18px 18px 48px;flex:1}
#pk-body .dh .big.mon{width:96px;height:96px}
/* hover tooltip */
#tip{position:fixed;z-index:40;max-width:320px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);padding:10px 12px;font-size:13px;pointer-events:none;display:none}
#tip .th{display:flex;gap:10px;align-items:center;margin-bottom:6px}
#tip .th img{width:44px;height:44px;object-fit:contain}
#tip .th b{display:block;font-size:14px}
#tip ul{margin:4px 0 0;padding-left:16px}
#tip .kvs{display:grid;grid-template-columns:auto auto;gap:0 12px;margin-top:4px}
#tip .kvs span{color:var(--muted)}
@media (max-width:820px){
  #peek{top:0;width:100vw}
  body{overflow:auto;height:auto}
  header{flex-wrap:wrap;padding:0 16px}
  header .meta{display:none}
  nav{flex-basis:100%;order:3}
  main{display:block}
  #side{border-right:0;border-bottom:1px solid var(--line)}
  #list{max-height:42vh}
  #detail{padding:16px 16px 48px;overflow:visible}
}
</style>
</head>
<body>
<header>
  <div class="brand">Aetheria Wiki</div>
  <nav id="nav"></nav>
  <div class="meta" id="meta"></div>
  <button id="theme" title="สลับธีม">ธีม</button>
</header>
<main>
  <aside id="side">
    <div id="filters"></div>
    <div id="count"></div>
    <div id="list" tabindex="0"></div>
  </aside>
  <article id="detail"></article>
</main>
<aside id="peek" aria-label="รายละเอียด">
  <div class="pk-bar"><button id="pk-back" title="ย้อนกลับ">←</button><span class="pk-t" id="pk-title"></span><a id="pk-open" data-nav href="#">เปิดเต็มหน้า</a><button id="pk-close" title="ปิด (Esc)">✕</button></div>
  <div id="pk-body"></div>
</aside>
<div id="tip"></div>
<script>
const DATA = /*__DATA__*/null;
const BASE = 'https://aetheria-online.in.th';

/* ---------- labels (taken from the official wiki) ---------- */
const EL = {neutral:'ไร้ธาตุ',water:'น้ำ',earth:'ดิน',fire:'ไฟ',wind:'ลม',poison:'พิษ',holy:'ศักดิ์สิทธิ์',shadow:'ความมืด',ghost:'วิญญาณ',undead:'ผีดิบ'};
const RACE = {formless:'ไร้รูปร่าง',undead:'อันเดด',brute:'สัตว์',plant:'พืช',insect:'แมลง',fish:'สัตว์น้ำ',demon:'ปีศาจ','demi-human':'มนุษย์',angel:'เทวดา',dragon:'มังกร'};
const SIZE = {small:'เล็ก',medium:'กลาง',large:'ใหญ่'};
const RARITY = {common:'ธรรมดา',uncommon:'ดี',rare:'หายาก',epic:'มหากาพย์',legendary:'ตำนาน'};
const ITEMTYPE = {Equipment:'อุปกรณ์',Consumable:'ของใช้',Miscellaneous:'ของสะสม/วัตถุดิบ',AwakeningStone:'ศิลาปลุกพลัง',WeaponStone:'ศิลาอาวุธ',Enchantment:'วัสดุตีบวก',Craft:'วัสดุคราฟต์',Card:'การ์ด'};
const SLOT = {Weapon:'อาวุธ',Helmet:'หมวก',HeadMid:'หัวกลาง',HeadLow:'หัวล่าง',Armor:'เสื้อเกราะ',Cape:'ผ้าคลุม',Glove:'ถุงมือ',Pants:'กางเกง',Boot:'รองเท้า',Acc:'เครื่องประดับ',Shield:'โล่',Ammo:'ลูกธนู',Gem:'เจม',LevelGem:'เจมเลเวล',CostumeHeadTop:'คอสตูมหมวก',CostumeHeadMid:'คอสตูมหน้า',CostumeHeadLow:'คอสตูมปาก',CostumeGarment:'คอสตูมผ้าคลุม',CostumeSpirit:'คอสตูมภูต',CostumeOutfit:'คอสตูมชุด',CostumeCompanion:'คอสตูมคู่หู'};
const WEAPON = {Sword:'ดาบ',TwoHandSword:'ดาบสองมือ',Dagger:'มีดสั้น',Axe:'ขวาน',TwoHandAxe:'ขวานสองมือ',Spear:'หอก',TwoHandSpear:'หอกสองมือ',Mace:'กระบอง',Staff:'คทา',Bow:'ธนู',Knuckle:'สนับมือ',Katar:'คาตาร์',Instrument:'เครื่องดนตรี',Whip:'แส้',Book:'หนังสือ',Gun:'ปืน',Huuma:'ฮูม่า'};
const ATTR = {STR:'STR',AGI:'AGI',VIT:'VIT',INT:'INT',DEX:'DEX',LUK:'LUK',MELEE_ATTACK:'ATK',RANGE_ATTACK:'ATK (ระยะไกล)',MAGIC_ATTACK:'MATK',HIT:'HIT',FLEE:'FLEE',CRI:'CRIT',CRI_DAMAGE:'ดาเมจคริ %',MELEE_DEFENSE:'DEF',MAGIC_DEFENSE:'MDEF',MAXHP:'Max HP',MAXSP:'Max SP',MAXHP_PERCENT:'Max HP %',MAXSP_PERCENT:'Max SP %',ATK_PERCENT:'ATK %',MATK_PERCENT:'MATK %',ATK_SPEED:'ASPD',ATK_SPEED_PERCENT:'ASPD %',MOVE_SPEED:'ความเร็วเดิน %',CASTING_SPEED:'ความเร็วร่าย',MELEE_DAMAGE_PERCENT:'ดาเมจประชิด %',RANGE_DAMAGE_PERCENT:'ดาเมจระยะไกล %',MAGIC_DAMAGE_PERCENT:'ดาเมจเวท %',DAMAGE_REDUCTION:'ลดดาเมจที่ได้รับ %',BLOCK_CHANCE:'โอกาสบล็อก %',HEAL_POWER:'พลังฮีล %',HP_DRAIN_ATTACK:'ตีปกติดูดเลือด %',HP_DRAIN_SKILL:'สกิลดูดเลือด %',SP_DRAIN_ATTACK:'ตีปกติดูด SP %',SP_DRAIN_SKILL:'สกิลดูด SP %',STUN_RESIST:'กันสตัน %',MAX_WEIGHT:'น้ำหนักที่แบกได้',ATTACK_RANGE:'ระยะโจมตี (ช่อง)',ATK_STR_OVER_99:'ATK (เมื่อ STR เกิน 99)',RANGED_DAMAGE_REDUCTION:'ลดดาเมจระยะไกลที่ได้รับ %',PERFECT_DODGE:'Perfect Dodge',IGNORE_SIZE:'ยกเลิกการลงโทษขนาดของอาวุธ',BOSS_DAMAGE_REDUCTION:'ลดดาเมจจากบอส %',VS_BOSS:'ดาเมจใส่บอส/MVP %',VS_STATUS:'ดาเมจใส่เป้าที่ติดสถานะผิดปกติ %',PIERCE_RESIST:'ต้านการเจาะเกราะ %',HIT_STACK:'ตีเป้าเดิมครบ (ครั้ง) ครั้งถัดไปแรงขึ้น',HIT_STACK_PERCENT:'ดาเมจครั้งที่ครบ %',CAST_REDUCTION:'ลดเวลาร่าย %',MELEE_DAMAGE_REDUCTION:'ลดดาเมจประชิดที่ได้รับ %',MAGIC_DAMAGE_REDUCTION:'ลดดาเมจเวทที่ได้รับ %',DAMAGE_REDUCTION_VIT:'ลดดาเมจ 1% ทุก VIT 10 สูงสุด %',VS_SIZE_ALL:'ดาเมจใส่มอนทุกขนาด %',GEM_SKILL_DAMAGE:'ดาเมจสกิล %',MOVE_SPEED_PERCENT:'ความเร็วเดิน %'};
const PER_TARGET = [
  ['VS_ELEMENT_','ดาเมจใส่มอนธาตุ{n} %',EL],['VS_RACE_','ดาเมจใส่มอนเผ่า{n} %',RACE],['VS_SIZE_','ดาเมจใส่มอนขนาด{n} %',SIZE],
  ['RESIST_ELEMENT_','ลดดาเมจจากธาตุ{n} %',EL],['RESIST_RACE_','ลดดาเมจจากมอนเผ่า{n} %',RACE],['PHYS_RESIST_RACE_','ลดดาเมจกายภาพจากมอนเผ่า{n} %',RACE],
  ['MAGIC_RESIST_RACE_','ลดดาเมจเวทจากมอนเผ่า{n} %',RACE],['MAGIC_VS_RACE_','ดาเมจเวทใส่มอนเผ่า{n} %',RACE],['RESIST_SIZE_','ลดดาเมจจากมอนขนาด{n} %',SIZE],['ELEMENT_DAMAGE_','ดาเมจการโจมตีธาตุ{n} %',EL]];
const EL_COLOR = {}; (DATA.elements.list||[]).forEach(e=>EL_COLOR[e.id]=e.color);
const ELS = DATA.elements.list.map(e=>e.id);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => (n ?? 0).toLocaleString('en-US');
const pct = c => { const p = c*100; return (p >= 1 ? +p.toFixed(2) : +p.toPrecision(2)) + '%'; };
function attrLabel(t){
  if (ATTR[t]) return ATTR[t];
  for (const [p, tpl, dict] of PER_TARGET) if (t.startsWith(p)) { const k = t.slice(p.length).toLowerCase(); return tpl.replace('{n}', dict[k] || k); }
  return t;
}
function attrShort(type, value){
  const l = attrLabel(type), p = / %$/.test(l);
  return [p ? l.slice(0, -2) : l, `${value > 0 ? '+' : ''}${value}${p ? '%' : ''}`];
}
function attrText(a){
  const [l, v] = attrShort(a.type, a.value);
  let s = `${esc(l)} <b>${v}</b>`;
  if (a.perRefine) s += ` <span class="note">(+${a.perRefine} ต่อการตีบวก)</span>`;
  if (a.minRefine) s += ` <span class="note">(ตีบวก +${a.minRefine} ขึ้นไป)</span>`;
  return s;
}
const elTag = (el, lv) => `<span class="el" style="background:${EL_COLOR[el]||'#888'}">${esc(EL[el]||el)}${lv ? ' ' + lv : ''}</span>`;
const itemIcon = id => { const p = DATA.icons.items[id]; return p ? `${BASE}/art/icons/${p}` : ''; };
const skillIcon = id => { const p = DATA.icons.skills[id]; return p ? `${BASE}/art/icons/${p}` : ''; };
const monArt = id => { const f = DATA.monsterArt[id]; return f ? `${BASE}/art/monsters/${f}` : ''; };
const img = (src, cls='') => src ? `<img src="${src}" alt="" loading="lazy" class="${cls}" onerror="this.style.visibility='hidden'">` : '';
function mult(atk, def, lv){ const r = (DATA.elements.matrix[atk]||{})[def]; return r ? r[(lv||1)-1] : 1; }
function mulChip(x){
  const c = x === 0 ? 'b' : x < 1 ? 'w' : x > 1 ? 'g' : 'n';
  return `<span class="mul ${c}">${x === 0 ? 'x0' : 'x' + (+x.toFixed(2))}</span>`;
}
const opts = (obj, all='ทั้งหมด', cur='') => `<option value="">${all}</option>` + Object.entries(obj).map(([k,v]) => `<option value="${esc(k)}"${k===cur?' selected':''}>${esc(v)}</option>`).join('');

/* ---------- indexes ---------- */
const itemById = new Map(DATA.items.map(i => [String(i.id), i]));
const monById = new Map(DATA.monsters.map(m => [String(m.id), m]));
const realMons = DATA.monsters.filter(m => !m.trainingDummy);
const mapName = new Map(DATA.maps.map(m => [m.id, m.name]));
const mapsById = new Map();
for (const m of realMons) for (const s of (m.spawns||[])) {
  let x = mapsById.get(s.mapId);

const MODES = {
  melee:  {label:'ประชิด (กายภาพ)', pct:'ดาเมจประชิด', hint:'พิษ = Venom Coat ของ Assassin · ไฟ/น้ำ/ลม/ดิน/ศักดิ์สิทธิ์ = ใบ Converter'},
  ranged: {label:'ตีไกล (กายภาพ)', pct:'ดาเมจระยะไกล', hint:'ธาตุของลูกธนู/กระสุน หรือใบ Converter'},
  magic:  {label:'เวท', pct:'ดาเมจเวท', hint:'ธาตุของสกิลเวทที่ใช้ เช่น Flame Lance = ไฟ'},
};
function cardBonus(c){
  const b = {el:{}, race:{}, mrace:{}, size:{}, melee:0, ranged:0, magic:0}; let any = false;
  for (const a of c.attributes || []) {
    for (const [p, k] of [['VS_ELEMENT_','el'],['MAGIC_VS_RACE_','mrace'],['VS_RACE_','race'],['VS_SIZE_','size']]) if (a.type.startsWith(p)) {
      const key = a.type.slice(p.length).toLowerCase(); b[k][key] = (b[k][key] || 0) + a.value; any = true; break;
    }
    if (a.type === 'VS_SIZE_ALL') { for (const s of SIZES0) b.size[s] = (b.size[s] || 0) + a.value; any = true; }
    if (a.type === 'MELEE_DAMAGE_PERCENT') { b.melee += a.value; any = true; }
    if (a.type === 'RANGE_DAMAGE_PERCENT') { b.ranged += a.value; any = true; }
    if (a.type === 'MAGIC_DAMAGE_PERCENT') { b.magic += a.value; any = true; }
  }
  return any ? b : null;
}
const SIZES0 = Object.keys(SIZE);
// per-target bonuses that count for the current style
function modeParts(b){
  const m = calc.mode, phys = m !== 'magic', es = phys || calc.magicElSize;
  return {el: es ? b.el : {}, race: phys ? b.race : b.mrace, size: es ? b.size : {}, pct: b[m] || 0};
}
const cardUseful = (b, ms) => { const p = modeParts(b); return p.pct > 0 || ms.some(m => p.el[m.element] || p.race[m.race] || p.size[m.size]); };
const WCARDS = DATA.items.filter(i => i.type === 'Card' && (i.cardSlotTypes || []).includes('Weapon') && i.droppedBy?.length)
  .map(c => ({c, b:cardBonus(c)})).filter(x => x.b);
function combos(arr, k, start = 0, pre = [], out = []){
  if (pre.length === k) { out.push(pre); return out; }
  for (let i = start; i < arr.length; i++) combos(arr, k, i, [...pre, arr[i]], out);
  return out;
}
function evalCombo(ms, atk, combo){
  const t = {el:{}, race:{}, size:{}, pct:0};
  for (const x of combo) {
    const p = modeParts(x.b);
    for (const k of ['el','race','size']) for (const [kk, v] of Object.entries(p[k])) t[k][kk] = (t[k][kk] || 0) + v;
    t.pct += p.pct;
  }
  const base = +calc.base[calc.mode] || 0;
  const xs = ms.map(m => mult(atk, m.element, m.elementLevel) * (1 + (t.el[m.element] || 0)/100) * (1 + (t.race[m.race] || 0)/100)
    * (1 + (t.size[m.size] || 0)/100) * (1 + (base + t.pct)/100) / (1 + base/100));
  const eff = xs.some(x => x === 0) ? 0 : ms.reduce((s,m) => s + m.hp, 0) / ms.reduce((s,m,i) => s + m.hp / xs[i], 0);
  return {xs, eff};
}

const VLEN = V.size + SIZES.length;
const DSLOTS = [['Armor','เสื้อ'],['Cape','ผ้าคลุม'],['Shield','โล่'],['Pants','กางเกง'],['Boot','รองเท้า'],['Head','หมวก']];
function defVec(c){
  const v = new Float64Array(VLEN); let any = false;
  const put = (i, x) => { if (i >= 0) { v[i] += x; any = true; } };
  for (const a of c.attributes || []) {
    const t = a.type, low = s => t.slice(s.length).toLowerCase();
    if (t === 'DAMAGE_REDUCTION') put(V.dr, a.value);
    else if (t === 'MELEE_DAMAGE_REDUCTION') put(V.melee, a.value);
    else if (t === 'RANGED_DAMAGE_REDUCTION') put(V.ranged, a.value);
    else if (t === 'MAGIC_DAMAGE_REDUCTION') put(V.magic, a.value);
    else if (t === 'MAXHP') put(V.hp, a.value);
    else if (t === 'MAXHP_PERCENT') put(V.hpPct, a.value);
    else if (t.startsWith('RESIST_ELEMENT_')) put(V.el + ELS.indexOf(low('RESIST_ELEMENT_')), a.value);
    else if (t.startsWith('PHYS_RESIST_RACE_')) put(V.pr + RACES.indexOf(low('PHYS_RESIST_RACE_')), a.value);
    else if (t.startsWith('MAGIC_RESIST_RACE_')) put(V.mr + RACES.indexOf(low('MAGIC_RESIST_RACE_')), a.value);
    else if (t.startsWith('RESIST_RACE_')) put(V.race + RACES.indexOf(low('RESIST_RACE_')), a.value);
    else if (t.startsWith('RESIST_SIZE_')) put(V.size + SIZES.indexOf(low('RESIST_SIZE_')), a.value);
  }
  return any ? v : null;
}
const DCARDS = DATA.items.filter(i => i.type === 'Card' && i.droppedBy?.length).map(c => ({c, v:defVec(c)})).filter(x => x.v);
const slotOf = c => (c.cardSlotTypes || []).some(s => ['Helmet','HeadMid','HeadLow'].includes(s)) ? 'Head' : (c.cardSlotTypes || [])[0];
function mapHits(ms){
  const d = calc.def, hits = [];
  const wsum = ms.reduce((s, m) => s + (m.atk + m.atkMax) / 2, 0) || 1;
  for (const m of ms) {
    const w = (m.atk + m.atkMax) / 2 / wsum, sk = m.skills || [], share = sk.length ? Math.min(100, Math.max(0, +d.skill || 0)) / 100 : 0;
    const base = {m, race:RACES.indexOf(m.race), size:SIZES.indexOf(m.size)};
    hits.push({...base, el:ELS.indexOf(d.normEl === 'own' ? m.element : 'neutral'), phys:!m.magicAttack, melee:m.attackRangeTiles < 4, w:w * (1 - share)});
    for (const s of sk) hits.push({...base, el:ELS.indexOf(s.element || 'neutral'), phys:s.kind !== 'magic', melee:(s.rangeTiles || 0) < 4, w:w * share / sk.length});
  }
  return hits.filter(h => h.w > 0);
}
function defScore(T, hits){
  const d = calc.def, bdr = Math.min(99, +d.dr || 0), hp = Math.max(1, +d.hp || 1);
  const pos = x => Math.max(0, x);
  const fdr = pos(1 - (bdr + T[V.dr]) / 100) / (1 - bdr / 100);
  let dmg = 0;
  for (const h of hits) {
    let f = fdr * pos(1 - T[V.el + h.el] / 100) * pos(1 - (T[V.race + h.race] + T[(h.phys ? V.pr : V.mr) + h.race]) / 100) * pos(1 - T[V.size + h.size] / 100);
    f *= h.phys ? pos(1 - T[h.melee ? V.melee : V.ranged] / 100) : pos(1 - T[V.magic] / 100);
    dmg += h.w * f;
  }
  const hpf = (hp * (1 + T[V.hpPct] / 100) + T[V.hp]) / hp;
  return {dmg, hpf, life: hpf / Math.max(dmg, 1e-9)};
}
function runDef(mp){
  const out1 = $('#cd-out1'); if (!out1) return;
  const ms = pickedMons(mp);
  if (!ms.length) { out1.innerHTML = `<p class="empty">เลือกมอนอย่างน้อย 1 ตัว</p>`; return; }
  const hits = mapHits(ms), d = calc.def;
  const usedEl = new Set(hits.map(h => h.el)), usedRace = new Set(hits.map(h => h.race)), usedSize = new Set(hits.map(h => h.size));
  const anyPM = hits.some(h => h.phys && h.melee), anyPR = hits.some(h => h.phys && !h.melee), anyMag = hits.some(h => !h.phys);
  const useful = v => v[V.dr] || v[V.hp] || v[V.hpPct] || (anyPM && v[V.melee]) || (anyPR && v[V.ranged]) || (anyMag && v[V.magic])
    || [...usedEl].some(i => v[V.el + i]) || [...usedRace].some(i => v[V.race + i] || v[V.pr + i] || v[V.mr + i]) || [...usedSize].some(i => v[V.size + i]);
  const pool = {}; for (const [s] of DSLOTS) pool[s] = [];
  const same = new Map(); // cards with identical defensive stats in the same slot are interchangeable: keep one, list the rest
  for (const x of DCARDS) {
    const s = slotOf(x.c); if (!pool[s] || cardOff(x.c) || !useful(x.v)) continue;
    const key = s + '|' + Array.from(x.v).join(',');
    if (same.has(key)) same.get(key).alts.push(x.c); else { const e = {...x, alts:[]}; same.set(key, e); pool[s].push(e); }
  }
  const solve = withShield => {
    const slots = [];
    for (const [s] of DSLOTS) {
      if (s === 'Shield') { if (withShield) slots.push({s, opts:[null, ...pool.Shield]}); continue; }
      if (s === 'Head') { const n = Math.max(0, Math.min(3, +d.head || 0)); for (let i = 0; i < n; i++) slots.push({s, opts:[null, ...pool.Head], head:i}); continue; }
      if (d.slots[s]) slots.push({s, opts:[null, ...pool[s]]});
    }
    const T = new Float64Array(VLEN), pick = [], top = [];
    const rec = (i, minHead) => {
      if (i === slots.length) {
        const r = defScore(T, hits);
        if (top.some(t => Math.abs(t.life - r.life) < 1e-9)) return;
        if (top.length < 6 || r.life > top[top.length - 1].life) {
          top.push({...r, pick:pick.slice()}); top.sort((a, b) => b.life - a.life); if (top.length > 6) top.pop();
        }
        return;
      }
      const sl = slots[i], start = sl.head !== undefined && sl.head > 0 ? minHead : 0;
      for (let k = start; k < sl.opts.length; k++) {
        const o = sl.opts[k];
        if (o) for (let j = 0; j < VLEN; j++) T[j] += o.v[j];
        pick.push(o ? {s:sl.s, c:o.c, alts:o.alts} : null);
        rec(i + 1, sl.head !== undefined ? k : 0);
        pick.pop();
        if (o) for (let j = 0; j < VLEN; j++) T[j] -= o.v[j];
      }
    };
    rec(0, 0);
    return {top, base:defScore(new Float64Array(VLEN), hits)};
  };
  const table = ({top, base}) => !top.length ? `<p class="empty">ไม่มีการ์ดที่ช่วยในแผนที่นี้</p>` : `<div class="tw"><table><tr><th>#</th><th>การ์ด</th><th class="num">ดาเมจที่รับ</th><th class="num">Max HP</th><th class="num">ทนได้นานขึ้น</th></tr>
    ${top.map((r, i) => {
      const cards = r.pick.filter(Boolean);
      const link = c => `<a class="mini" href="#cards/${c.id}">${img(itemIcon(c.id))}${isBossCard(c) ? '👑 ' : ''}${esc(c.name.replace(/ Card$/, ''))}</a><button class="x" title="ไม่มี/ซื้อไม่ได้ — ตัดการ์ดนี้ออก" data-cc-ex="${c.id}">✕</button>`;
      return `<tr class="${i === 0 ? 'best' : ''}"><td>${i + 1}</td><td><div class="cc-cards">${cards.length ? cards.map(p => `<span><span class="note">${DSLOTS.find(s => s[0] === p.s)[1]}:</span> ${[p.c, ...(p.alts || [])].map(link).join(' <span class="note">หรือ</span> ')}</span>`).join('') : '<span class="note">ไม่ใส่</span>'}</div></td>
        <td class="num">${r.dmg < base.dmg ? `<span class="mul g">−${Math.round((1 - r.dmg / base.dmg) * 100)}%</span>` : '<span class="mul n">0%</span>'}</td>
        <td class="num">${r.hpf > 1 ? `+${Math.round((r.hpf - 1) * 100)}%` : '-'}</td>
        <td class="num"><b>+${Math.round((r.life / base.life - 1) * 100)}%</b></td></tr>`;
    }).join('')}</table></div>`;
  out1.innerHTML = `<h3 style="margin:14px 0 6px;font-size:14px">ใส่โล่ได้ (มือเดียว + โล่)</h3>` + table(solve(true))
    + `<h3 style="margin:18px 0 6px;font-size:14px">ใส่โล่ไม่ได้ (คาตาร์ / อาวุธสองมือ / ถือสองมือ)</h3>` + table(solve(false));
}

function generic(v){
  if (v == null) return '';
  if (Array.isArray(v)) return `<ul class="plain">${v.map(x => `<li>${typeof x === 'object' ? generic(x) : esc(x)}</li>`).join('')}</ul>`;
  if (typeof v === 'object') {
    if (v.itemId && itemById.has(String(v.itemId))) return `${itemLink(v.itemId)}${v.amount ? ` ×${v.amount}` : ''}`;
    return `<div class="kv">${Object.entries(v).map(([k,x]) => `<div><span>${esc(k)}</span><b>${typeof x === 'object' ? generic(x) : esc(x)}</b></div>`).join('')}</div>`;
  }
  return esc(v);
}

if (DATA.generatedAt) $('#meta').textContent = 'ข้อมูล ' + new Date(DATA.generatedAt).toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'numeric'});

  const C = CATS[cur], st = state[cur];

/* stone page: main value at every stone level × refine step, from the player's own stone */
// refine adds the same amount every step (at Lv.1); the stone level multiplies on top. Two rules fit the in-game numbers:
//  A: 12.5% of the COMMON tier's max roll, whatever the stone's tier (all commons, Trauma rare, Arcane Flow rare)
//  B: k × the stone's own tier max (Cooldown Recovery rare 5% ladder, Brutality rare, Multistrike epic)
const REFINE_B = {common:0.125, rare:0.05, epic:0.02, legendary:0.008};
const REFINE_KNOWN = {trauma:'A', 'arcane-flow':'A', 'cooldown-recovery':'B', brutality:'B', multistrike:'B'};
const refineStep = (st, tier, rule) => rule === 'A' ? 0.125 * (st.tiers.find(t => t.tier === 'common') || tier).main[1] : (REFINE_B[tier.tier] ?? 0.125) * tier.main[1];
const RULE_TXT = {A:'ขั้นละ 12.5% ของค่าสูงสุดระดับธรรมดา', B:'ขั้นละ % ของค่าสูงสุดของระดับนี้ (ธรรมดา 12.5 · หายาก 5 · มหากาพย์ ~2 · ตำนาน ~0.8)'};
$('#detail').addEventListener('click', e => { const j = e.target.closest('[data-jump]'); if (j) document.getElementById(j.dataset.jump)?.scrollIntoView({behavior:'smooth', block:'start'}); });
$('#detail').addEventListener('input', e => {
  if (!['stc-v', 'stc-l', 'stc-r', 'stc-t', 'stc-s'].includes(e.target.id)) return;
  const st = CATS.stones.get(state.stones.sel); if (!st) return;
  const v = +$('#stc-v').value, L = +$('#stc-l').value, R = +$('#stc-r').value, out = $('#stc-out');
  if (!(v > 0)) { out.innerHTML = ''; return; }
  const lf = l => 1 + PER_LV * (l - 1) / 100, tier = st.tiers.find(t => t.tier === $('#stc-t').value) || st.tiers[0];
  const typed = +$('#stc-s').value > 0;
  const fits = step1 => { const roll = v / lf(L) - R * step1; return roll >= tier.main[0] - 0.6 && roll <= tier.main[1] + 0.6; };
  let rule = REFINE_KNOWN[st.id], why;
  if (tier.tier === 'common') { rule = 'A'; why = 'ยืนยันกับศิลาระดับธรรมดา 4 ก้อน'; }
  else if (rule) why = 'ยืนยันกับรายการ/ค่าในเกมของศิลาชนิดนี้แล้ว';
  else if (R > 0) {
    const a = fits(refineStep(st, tier, 'A')), b = fits(refineStep(st, tier, 'B'));
    rule = a || !b ? 'A' : 'B';
    why = a && b ? 'ทั้ง 2 สูตรเข้าช่วง เลือกสูตร A ไว้ก่อน' : a || b ? 'เลือกสูตรที่ทำให้ค่าสุ่มอยู่ในช่วงของระดับ' : 'ไม่มีสูตรไหนเข้าช่วง';
  } else { rule = 'A'; why = 'ศิลาชนิดนี้ยังไม่มีข้อมูลตีบวก ใช้สูตร A ไว้ก่อน'; }
  const step1 = typed ? +$('#stc-s').value / lf(L) : refineStep(st, tier, rule);   // per refine step, at Lv.1
  const other = rule === 'A' ? 'B' : 'A', step2 = refineStep(st, tier, other);
  const roll = v / lf(L) - R * step1;
  const val = (l, r) => (roll + r * step1) * lf(l);
  const inRange = fits(step1);
  const sure = typed || tier.tier === 'common' || REFINE_KNOWN[st.id];
  const alt = !sure && Math.abs(step2 - step1) > 1e-9 ? (() => { const r2 = v / lf(L) - R * step2; return ` <span class="note">· ถ้าเป็นสูตร ${other}: ${R > 0 ? `ค่าสุ่ม ${r2.toFixed(1)}${fits(step2) ? ' (ก็อยู่ในช่วง)' : ' (ไม่อยู่ในช่วง)'}` : `Lv.${STONE_MAXLV} +5 = ${((r2 + 5 * step2) * lf(STONE_MAXLV)).toFixed(1)}`}</span>`; })() : '';
  out.innerHTML = `<p class="note">ค่าสุ่มเริ่มต้น (Lv.1, +0) ≈ <b>${roll.toFixed(1)}</b> ${inRange ? `อยู่ในช่วงระดับ${esc(RARITY[tier.tier])} (${tier.main.join('–')}) ✓` : `<span style="color:var(--warn)">ไม่อยู่ในช่วงระดับ${esc(RARITY[tier.tier])} (${tier.main.join('–')}) — ${typed ? 'เช็กระดับหรือตัวเลขที่ใส่' : 'ใส่ "เพิ่มต่อขั้น" จากรายการตีบวกในเกม'}</span>`} · ${typed ? 'ใช้ค่าเพิ่มต่อขั้นที่ใส่' : `สูตร ${rule}: ${RULE_TXT[rule]} = ${(step1 * lf(L)).toFixed(2)} ต่อขั้นที่ Lv.${L} ${sure ? `(${why})` : `<span style="color:var(--warn)">(${why} — ถ้ามีรายการตีบวกในเกม ใส่ "เพิ่มต่อขั้น" จะแม่นกว่า)</span>`}`}${alt}</p>
    <div class="tw"><table><tr><th>เลเวล \ ตีบวก</th>${[0,1,2,3,4,5].map(r => `<th class="num">+${r}</th>`).join('')}</tr>
    ${Array.from({length:STONE_MAXLV}, (_, i) => i + 1).map(l => `<tr><td>Lv.${l}</td>${[0,1,2,3,4,5].map(r => `<td class="num"${l === L && r === R ? ' style="background:var(--accent-soft);font-weight:700"' : ''}>${val(l, r).toFixed(1)}</td>`).join('')}</tr>`).join('')}</table></div>`;
});
